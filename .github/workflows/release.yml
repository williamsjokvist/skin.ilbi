name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: "--yes"

      - run: mise lint:check

      - run: mise fmt:check

      - run: mise bump "${GITHUB_REF_NAME#v}"

      - run: mise install-fonts

      - run: mise bundle

      - name: Commit the version bump and move the tag onto it
        run: |
          version="${GITHUB_REF_NAME#v}"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git checkout master
          git add addon.xml
          if git diff --cached --quiet; then
            echo "addon.xml already at $version on master"
          else
            git commit -m "chore: release $version"
            git pull --rebase origin master
            git push origin master
          fi
          # The tag that triggered this run points at the commit before the bump.
          # Move it onto the release commit so the tag, the zip and the generated
          # notes all describe the same tree.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$GITHUB_REF_NAME")" ]; then
            git tag -f "$GITHUB_REF_NAME" HEAD
            git push --force origin "refs/tags/$GITHUB_REF_NAME"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "dist/skin.ilbi-${GITHUB_REF_NAME#v}.zip"
